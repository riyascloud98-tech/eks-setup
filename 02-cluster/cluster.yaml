# Step 2 — the EKS cluster itself.

# This is an eksctl ClusterConfig (eksctl is a CLI wrapper that turns this
# YAML into the right CloudFormation under the hood — you're not writing
# raw CloudFormation, just this file). Apply with:
#
#   eksctl create cluster -f cluster.yaml
#
# This one command: creates the EKS control plane, creates one managed
# node group (real EC2 instances that run your pods) in your existing
# private-app subnets, and wires the OIDC provider so pods can later
# assume IAM roles (needed for the ALB controller in step 4).
#
# It takes ~15-20 minutes. It also costs money from the moment it's
# created (control plane is a flat hourly fee + the EC2 nodes) — nothing
# here is reversible-for-free, so only run this once you're ready.

apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: india-eks
  region: ap-south-1
  # 1.34 matches the kubectl client version already on this machine
  # (kubectl supports one minor version of skew either way — picking a
  # version close to your client avoids compatibility surprises).
  version: "1.34"

# --- Use your existing VPC, not one eksctl creates for you ---
vpc:
  id: vpc-01e4021e3eedba594
  subnets:
    # Public-web-* subnets: only used for the ALB (created in step 5).
    # The cluster needs to know about them so the AWS Load Balancer
    # Controller can place the ALB's ENIs there.
    public:
      ap-south-1a: { id: subnet-06b97ccb48b7eebc6 } # Public-web-A
      ap-south-1b: { id: subnet-0595dc8c2cb950f9d } # Public-web-B
      ap-south-1c: { id: subnet-08afc29177531432e } # Public-web-C
    # private-app-* subnets: where the worker nodes (and your pods) live.
    # No direct internet inbound; outbound goes through the NAT gateway
    # already on this route table.
    private:
      ap-south-1a: { id: subnet-08696b445eb48a346 } # private-app-A
      ap-south-1b: { id: subnet-08a5dc4d027dd3d9c } # private-app-B
      ap-south-1c: { id: subnet-0545f7c585e03f968 } # private-app-C
  clusterEndpoints:
    # publicAccess lets you run kubectl from this laptop against the
    # cluster's API server. privateAccess would only be needed if you
    # wanted to reach the API server from inside the VPC as well.
    publicAccess: true
    privateAccess: false

# --- IAM: use the roles you created by hand in step 1, not
#     eksctl's own auto-created ones (so you know exactly what
#     permissions exist and why) ---
iam:
  serviceRoleARN: "arn:aws:iam::590183900382:role/india-eks-cluster-role"
  # Required for step 4 (AWS Load Balancer Controller) and any future
  # "pod needs to call an AWS API" use case. This is what lets a
  # Kubernetes ServiceAccount assume an IAM role without static
  # credentials.
  withOIDC: true

# --- The worker nodes ---
managedNodeGroups:
  - name: india-app-ng
    instanceType: t3.medium
    # Start small; this is exactly the kind of thing to revisit once you
    # see real traffic/CPU numbers. 2 nodes across 2-3 AZs gives you
    # basic resilience to one node/AZ having a problem.
    minSize: 2
    maxSize: 4
    desiredCapacity: 2
    privateNetworking: true
    subnets:
      - ap-south-1a
      - ap-south-1b
      - ap-south-1c
    # Your existing "allow traffic from the ALB SG only" security group.
    # eksctl still attaches the security groups EKS itself needs for
    # node<->control-plane communication; this is *additional*.
    securityGroups:
      attachIDs:
        - sg-0f8b6e007c2f5e53c # eks-india-app
    iam:
      instanceRoleARN: "arn:aws:iam::590183900382:role/india-eks-node-role"
    # SSM (session manager access, no SSH keys/bastion needed) is enabled
    # by default now — no ssh: block needed to get it.