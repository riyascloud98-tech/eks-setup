apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eks-india-fastapi
  namespace: india
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eks-india-fastapi
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
