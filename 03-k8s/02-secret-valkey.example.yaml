# Step 3c — TEMPLATE ONLY. Do not fill in the real password and apply
# this file — a plain YAML Secret is only base64 (NOT encrypted), and if
# this file has real values it's one `git add .` away from landing in
# your repo history forever.
#
# The safe way to create this Secret is the imperative command instead
# (never touches disk as a file), documented in ../../SETUP_GUIDE.md
# step 6:
#
#   kubectl create secret generic valkey-credentials \
#     --namespace india \
#     --from-literal=VALKEY_USERNAME=riyasdeen \
#     --from-literal=VALKEY_PASSWORD='indiaekstest@2812'
#
# This file just documents the *shape* of what that command creates, so
# you can see what the Deployment (03-deployment-fastapi.yaml) is
# referencing.
apiVersion: v1
kind: Secret
metadata:
  name: valkey-credentials
  namespace: india
type: Opaque
stringData:
  VALKEY_USERNAME: "riyasdeen"
  VALKEY_PASSWORD: "indiaekstest@2812"